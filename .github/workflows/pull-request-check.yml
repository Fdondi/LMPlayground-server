name: Pull Request Check

on: pull_request

jobs:

  AndroidTest:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: recursive
    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls /dev/kvm
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: 'gradle'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Run unit tests
      run: ./gradlew app:testDebugUnitTest -PskipScreenshots
    # app:lintDebug does not analyze library dependencies (lint.checkDependencies
    # defaults to false), so the new modules need their own runs or they rot.
    - name: Run lint
      run: ./gradlew app:lintDebug playground-api:lintDebug samples:chat-client:lintDebug
    # The sample proves the public API is usable without any :app internals.
    # Building it in CI is what keeps that true.
    - name: Build the API sample client
      run: ./gradlew samples:chat-client:assembleDebug
    - name: Run connected android tests
      run: ./gradlew app:mvdApi35Check
